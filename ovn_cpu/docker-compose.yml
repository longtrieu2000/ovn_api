version: '3.8'

services:
  # OVN CPU Monitoring Agent
  ovn-cpu-monitor:
    build:
      context: ./ovn_cpu
      dockerfile: Dockerfile
      network: host
    container_name: ovn_cpu_monitor
    ports:
      - "8002:8002"
    environment:
      - MONITOR_INTERVAL=5
      - OVN_PROCESSES=ovn-northd,ovn-controller,ovsdb-server
      - METRICS_PORT=8002
      - LOG_LEVEL=INFO
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./ovn_cpu/data:/app/data
    privileged: true
    network_mode: "host"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
