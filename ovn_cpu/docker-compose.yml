services:
  # OVN CPU Monitoring Agent
  ovn-cpu-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: ovn_cpu_monitor
    ports:
      - "8002:8002"
    environment:
      - OVN_CPU_HOST=0.0.0.0
      - OVN_CPU_PORT=8002
      - OVN_CPU_PROC_ROOT=/host/proc
      - OVN_CPU_SAMPLE_INTERVAL_S=5
      - OVN_CPU_PROCESS_NAMES=ovs-vswitchd,ovsdb-server,ovn-controller,ovn-controller-vtep,ovn-northd
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./data:/app/data
    privileged: true
    network_mode: "host"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
