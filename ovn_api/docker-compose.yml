services:
  ovn_api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: ovn_api_service
    env_file:
      - .env
    volumes:
      - .:/app
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    network_mode: "host"
